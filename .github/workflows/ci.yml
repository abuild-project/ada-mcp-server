name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ada-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the standalone AMD64 Trixie candidate once
        run: docker/build --tag ada-mcp-server:candidate
      - name: Complete unit, quality, coverage, package, docs and actual ALS chain
        run: docker/check ada-mcp-server:candidate
      - name: Package the same tested image and Python distributions
        run: python3 scripts/artifacts.py --image ada-mcp-server:candidate --output "$RUNNER_TEMP/release"
      - name: Obtain public pinned Arca, Spawn and Anet source cases
        run: |
          git clone https://github.com/abuild-project/arca-Ada.git "$RUNNER_TEMP/arca"
          git -C "$RUNNER_TEMP/arca" checkout --detach 20564468d00024e6f949e92c1da79850abf59086
          git clone https://github.com/abuild-project/spawn-manager.git "$RUNNER_TEMP/spawn"
          git -C "$RUNNER_TEMP/spawn" checkout --detach 18a0ac53be29da845e9059a77c274399b1cbf5ee
          git clone https://github.com/mweidle73/anet.git "$RUNNER_TEMP/anet"
          git -C "$RUNNER_TEMP/anet" checkout --detach 27a6e5a8746fa0779698db982b8ae9f414adf598
      - name: Actual generated-artifact provisioning and two Linux identities
        run: |
          python3 scripts/host_acceptance.py --release "$RUNNER_TEMP/release" \
            --output "$RUNNER_TEMP/host-evidence" --arca "$RUNNER_TEMP/arca" \
            --spawn "$RUNNER_TEMP/spawn" --anet "$RUNNER_TEMP/anet"
      - name: Upload exact tested release candidates without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/
          retention-days: 14
      - name: Preserve check evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-evidence
          path: |
            build/check/
            ${{ runner.temp }}/host-evidence/
            ${{ runner.temp }}/release/image-*-evidence.json
          if-no-files-found: warn
          retention-days: 14
