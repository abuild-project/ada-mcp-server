name: PR record

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-record:
    name: Check PR record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compare the PR body with its change record
        run: python3 -I scripts/check_pr_record.py
